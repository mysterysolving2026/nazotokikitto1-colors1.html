<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>爆弾解除ゲーム - 小謎</title>
  <style>
    body {
      body {
      font-family: "MS Gothic", "Hiragino Sans", sans-serif;
      margin-top: 40px;
      text-align: center;
    }
    /* タイマー */
    .timer {
      font-size: 7vw;
      margin-bottom: 20px;
    }

    /* 問題文 */
    .question {
      font-size: 5vw;
      margin-bottom: 10px;
    }

    /* 入力欄 */
    .input-box {
      width: 60vw;
      font-size: 5vw;
      padding: 4px;
      text-align: center;
    }

    /* ボタン */
    button {
      font-size: 5vw;
      padding: 2vw 4vw;
      margin-top: 8px;
      background-color: white;
      color: black;
      border: 2px solid black;
    }
    .error {
      color: red;
      font-size: 5vw;
      margin-top: 5px;
    }
    #nextButton {
      margin-top: 30px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>爆発まで残り...</h1>
  

  <!-- カウントダウン -->
  <div id="timer" class="timer"></div>

  <!-- 小謎3問 -->
  <h1>最初の問題だよ！ 頑張ってね</h1>
  <div id="puzzles">
    <div class="question">
      1問目：プロフィールに隠された数字は？
      <br>
      <input id="q1" class="input-box">
      <br>
      <button onclick="checkQ1()">決定</button>
      <div id="e1" class="error"></div>
    </div>

    <div class="question">
      2問目：ジャケットに隠されたものは？
      <br>
      <input id="q2" class="input-box">
      <br>
      <button onclick="checkQ2()">決定</button>
      <div id="e2" class="error"></div>
    </div>

    <div class="question">
      3問目：サインに隠されたものは？
      <br>
      <input id="q3" class="input-box">
      <br>
      <button onclick="checkQ3()">決定</button>
      <div id="e3" class="error"></div>
    </div>

    <button id="nextButton" onclick="goToColors()">次のページへ</button>
  </div>

  <script>
    // ページを開いた瞬間にカウントダウン開始
    window.onload = () => {
      startCountdown();
    };

    function startCountdown() {
  const saved = Number(localStorage.getItem("endTime"));
  const now = Date.now();

  // ★ 過去の endTime が残っていたらリセット
  if (!saved || saved < now) {
    const end = now + 20 * 60 * 1000;
    localStorage.setItem("endTime", end);
  }

  updateTimer();
  setInterval(updateTimer, 1000);
}


    function updateTimer() {
      const endTime = Number(localStorage.getItem("endTime"));
      const now = Date.now();
      const remaining = Math.floor((endTime - now) / 1000);

      if (remaining <= 0) {
        window.location.href = "gameover1.html";
        return;
      }

      const m = String(Math.floor(remaining / 60)).padStart(2, "0");
      const s = String(remaining % 60).padStart(2, "0");
      document.getElementById("timer").textContent = `${m}:${s}`;
    }

    let q1ok = false, q2ok = false, q3ok = false;

    function checkAll() {
      if (q1ok && q2ok && q3ok) {
        document.getElementById("nextButton").style.display = "inline-block";
      }
    }

    function checkQ1() {
      const v = document.getElementById("q1").value.trim();
      if (v === "3635") {
        q1ok = true;
        document.getElementById("e1").textContent = "正解だよ";
      } else {
        q1ok = false;
        document.getElementById("e1").textContent = "間違ってるね";
      }
      checkAll();
    }

    function checkQ2() {
      const v = document.getElementById("q2").value.trim();
      if (v === "せいかい") {
        q2ok = true;
        document.getElementById("e2").textContent = "正解だよ";
      } else {
        q2ok = false;
        document.getElementById("e2").textContent = "間違ってるね";
      }
      checkAll();
    }

    function checkQ3() {
      const v = document.getElementById("q3").value.trim();
      if (v === "せいかい") {
        q3ok = true;
        document.getElementById("e3").textContent = "正解だよ";
      } else {
        q3ok = false;
        document.getElementById("e3").textContent = "間違ってるね";
      }
      checkAll();
    }

    function goToColors() {
      window.location.href = "colors1.html";
    }
  </script>

</body>
</html>
